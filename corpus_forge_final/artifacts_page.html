<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corpus Forge</title>
    <link
      rel="stylesheet"
      href="/static/css/style.css"
    />
  </head>
  <body>
    <header class="app-header">
      <a
        class="brand"
        href="/"
        aria-label="Corpus Forge dashboard"
      >
        <span class="brand-mark">CF</span>
        <span>
          <span class="brand-title">Corpus Forge</span>
          <span class="brand-subtitle">Local retrieval studio</span>
        </span>
      </a>
      <nav class="top-nav" aria-label="Main navigation">
        <a
          class=""
          href="/"
          >Dashboard</a
        >
        <a
          class="active"
          href="/artifacts"
          >Artifacts</a
        >
        <a
          class=""
          href="/visualization"
          >Visualization</a
        >
      </nav>
    </header>

    <!-- Persistent toast stack for server flashes and dynamic toasts -->
    <div class="toast-stack" aria-live="polite" aria-atomic="true">
        
    </div>

    <main class="page-shell">
<section class="hero-panel compact reveal">
    <div>
        <p class="eyebrow">Saved outputs</p>
        <h1>Generated artifacts</h1>
    </div>
    <a class="ghost-link" href="/">Back to dashboard</a>
</section>

<section class="panel reveal">
    
        <div class="empty-state">
            <h3>No artifacts generated yet</h3>
            <p>Create flashcards, quizzes, or reports from the dashboard.</p>
        </div>
    
</section>
</main>
    <script src="/static/js/app.js"></script>
  </body>
</html>
